[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "scan_postprocess"

dynamic = ["version"]
description = "scan_postprocess"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "proprietary"}
authors = [
    { name = "Hans Märki", email = "buhtig.hans.maerki@ergoinfo.ch" },
]
classifiers = [
]

dependencies = [
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pylint",
]

[project.scripts]
# scan_postprocess = "scan_postprocess.scan_postprocess:app"

[tool.pdm]
version = { source = "file", path = "src/scan_postprocess/__init__.py" }
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = [
    "src/",
]
source-includes = [
    "README.md"
]

[tool.ruff]
target-version = "py313"
# All paths are relative to the project root, which is the directory containing the pyproject.toml.
src = ["src", "tests"]
exclude = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    # "I",  # isort
    "I001", # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # "W191",  # indentation contains tabs
    "D",     # enable docstring checks
    "B027",  #  empty method in an abstract base class
]

[tool.ruff.lint.isort]
# known-third-party = ["usbhubctl"]
# known-local-folder = ["usbhubctl"]
case-sensitive = true
combine-as-imports = true
order-by-type = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.mypy]
# strict = true
# enable_incomplete_feature = ["NewGenericSyntax"]

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "line-too-long",
]
